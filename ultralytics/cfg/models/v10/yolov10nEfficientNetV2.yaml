# Parameters
nc: 6 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]


# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, efficientnet_v2, []]  # 4  ##4
  - [-1, 1, SPPF, [1024, 5]]  # 5  ##5
  - [-1,1, TripletAttention,[]] ##6
  - [-1, 1, PSA, [1024]] # 6 ##7

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 7 ##8
  - [[-1, 3], 1, Concat, [1]]  # 8 cat backbone P4 ##9
  - [-1, 3, C2f, [512]]  # 9 ##10

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10 ##11
  - [[-1, 2], 1, Concat, [1]]  # 11 cat backbone P3 ##12
  - [-1, 3, C2f, [256]]  # 12 (P3/8-small) ##13

  - [-1, 1, Conv, [256, 3, 2]] # 13  ##14
  - [[-1, 10], 1, Concat, [1]]  # 14 cat head P4  ##15
  - [-1, 3, C2f, [512]]  # 15 (P4/16-medium) ## 16

  - [-1, 1, SCDown, [512, 3, 2]] # 16## 17
  - [[-1, 7], 1, Concat, [1]]  # 17 cat head P5 ##18
  - [-1, 3, C2fCIB, [1024]]  # 18 (P5/32-large) ##19

  - [[13, 16, 19], 1, v10Detect, [nc]]  # Detect(P3, P4, P5)  ##20