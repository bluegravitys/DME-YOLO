<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Moonlit Lake</title>
  <desc id="desc">A quiet moonlit lake with mountains, pine trees, and a small boat.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141832"/>
      <stop offset="0.55" stop-color="#26395b"/>
      <stop offset="1" stop-color="#7d8aa6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4966"/>
      <stop offset="1" stop-color="#142130"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff9d8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#fff9d8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff9d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
